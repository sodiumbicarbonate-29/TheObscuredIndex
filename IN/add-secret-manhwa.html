<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-0.4deg); } 50% { transform: translateY(-6px) rotate(0.4deg); } }
</style>
</helmet>

<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; background: #0c0910;">

  <header style="position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; min-height: 72px; padding: 12px 24px; background: rgba(12, 9, 16, 0.9); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
      <img src="images/logo3.png" alt="The Obscured Index logo" style="height: 40px; width: 40px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(162,155,254,0.35));">
      <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.05rem; color: #f5f3fb; letter-spacing: 0.02em;">The Obscured Index</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
      <a href="secret-shelf.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.75); text-decoration: none;" style-hover="color: #ffffff;">&larr; SECRET SHELF</a>
      <a href="dashboard.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.55); text-decoration: none;" style-hover="color: #ffffff;">LOGOUT</a>
    </nav>
  </header>

  <main style="flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 24px 60px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="display: inline-block; background: rgba(255,255,255,0.06); color: #cfc9d8; font-family: 'Cinzel', serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; padding: 5px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); margin-bottom: 14px; transform: rotate(-2deg);">&#10024; SHHH &#10024;</div>
      <h1 style="font-family: 'Times New Roman', serif; letter-spacing: 1px; color: #f0ecfb; font-size: 2rem; margin: 0 0 10px;">Add to Secret Shelf</h1>
      <p style="color: #a49bb8; font-style: italic; font-size: 0.95rem; margin: 0;">Select manhwas from your library to add to your secret collection&hellip;</p>
    </div>

    <div style="background: rgba(18,14,24,0.85); border: 1px dashed rgba(255,255,255,0.18); border-radius: 18px; padding: 28px; animation: floaty 8s ease-in-out infinite;">
      <input value="{{ search }}" onInput="{{ onSearch }}" type="text" placeholder="Search your manhwas..." style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.9rem; margin-bottom: 18px;" style-focus="outline: none; border-color: rgba(255,255,255,0.5);">

      <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;">
        <input type="checkbox" checked="{{ allSelected }}" onChange="{{ toggleSelectAll }}" style="width: 18px; height: 18px;">
        <span style="color: #cfc9d8; font-weight: 600; font-size: 0.85rem;">Select All</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px;">
        <sc-for list="{{ filtered }}" as="m" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 14px; background: rgba(30,25,38,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px;">
            <input type="checkbox" checked="{{ m.selected }}" onChange="{{ m.toggle }}" style="width: 18px; height: 18px; flex-shrink: 0;">
            <div style="width: 46px; height: 64px; flex-shrink: 0; border-radius: 4px; background: repeating-linear-gradient(45deg, #1a1420, #1a1420 6px, #211a29 6px, #211a29 12px);"></div>
            <div style="flex: 1; min-width: 0;">
              <h3 style="margin: 0 0 4px; font-size: 0.9rem; color: #f0ecfb; font-weight: 600;">{{ m.title }}</h3>
              <p style="margin: 0; font-size: 0.75rem; color: #a49bb8;">{{ m.genre }} &middot; {{ m.status }}</p>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
        <a href="secret-shelf.html" style="text-decoration: none; font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.03em; color: #cfc9d8; border: 1px solid rgba(255,255,255,0.2); padding: 12px 22px; border-radius: 999px; font-weight: 600; white-space: nowrap;">BACK TO SECRET SHELF</a>
        <a href="secret-shelf.html" style="text-decoration: none; font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.03em; background: #211a29; color: #f0ecfb; border: 1px solid rgba(255,255,255,0.25); padding: 12px 22px; border-radius: 999px; font-weight: 700; white-space: nowrap;" style-hover="border-color: rgba(255,255,255,0.5); transform: rotate(-1deg);">ADD SELECTED &#10024;</a>
      </div>
    </div>
  </main>

  <footer style="background: rgba(12,9,16,0.95); border-top: 1px solid rgba(255,255,255,0.08); padding: 20px 32px; text-align: center;">
    <p style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.05em; color: rgba(245,243,251,0.5); margin: 0;">&copy; 2026 &mdash; The Obscured Index. All rights reserved.</p>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    search: '',
    manhwas: [
      { title: 'Moonlit Requiem', genre: 'Fantasy', status: 'Ongoing', selected: false },
      { title: 'The Silver Thorn', genre: 'BL', status: 'Ongoing', selected: false },
      { title: "Winter's Bloodline", genre: 'Straight', status: 'Completed', selected: false },
      { title: 'Hollow Court', genre: 'No Romance', status: 'Completed', selected: false },
    ],
  };

  onSearch = (e) => this.setState({ search: e.target.value });

  toggleOne = (idx) => {
    const manhwas = this.state.manhwas.map((m, i) => i === idx ? { ...m, selected: !m.selected } : m);
    this.setState({ manhwas });
  };

  toggleSelectAll = () => {
    const allSelected = this.state.manhwas.every(m => m.selected);
    this.setState({ manhwas: this.state.manhwas.map(m => ({ ...m, selected: !allSelected })) });
  };

  renderVals() {
    const { search, manhwas } = this.state;
    const q = search.trim().toLowerCase();
    const filtered = manhwas
      .map((m, i) => ({ ...m, toggle: () => this.toggleOne(i) }))
      .filter(m => !q || m.title.toLowerCase().includes(q));
    return {
      search,
      onSearch: this.onSearch,
      filtered,
      allSelected: manhwas.every(m => m.selected),
      toggleSelectAll: this.toggleSelectAll,
    };
  }
}

</script>
</body>
</html>
