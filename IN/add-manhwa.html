<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../images/logo.png">
<script src="js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body { margin: 0; }</style>
</helmet>

<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; background: #0e0a17;">

  <header style="position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; min-height: 72px; padding: 12px 24px; background: rgba(14, 10, 23, 0.85); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
      <img src="images/logo3.png" alt="The Obscured Index logo" style="height: 40px; width: 40px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(162,155,254,0.35));">
      <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.05rem; color: #f5f3fb; letter-spacing: 0.02em;">The Obscured Index</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
      <a href="dashboard.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.75); text-decoration: none;" style-hover="color: #ffffff;">HOME</a>
      <a href="library.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.75); text-decoration: none;" style-hover="color: #ffffff;">LIBRARY</a>
      <a href="add-manhwa.html" style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.04em; color: #0e0a17; text-decoration: none; background: linear-gradient(135deg, #a29bfe, #8a2be2); padding: 9px 16px; border-radius: 999px; font-weight: 600;">+ ADD NEW</a>
      <a href="obscured-index-landing.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.55); text-decoration: none;" style-hover="color: #ffffff;">LOGOUT</a>
    </nav>
  </header>

  <main style="flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 36px 24px 60px;">
    <a href="library.html" style="display: inline-flex; align-items: center; gap: 6px; color: #c9bffc; text-decoration: none; font-size: 0.85rem; margin-bottom: 14px;">&larr; Back to Library</a>
    <h1 style="font-family: 'Playfair Display', serif; font-weight: 500; color: #ffffff; font-size: 1.9rem; margin: 0 0 26px;">Add a New Manhwa</h1>

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 32px;">
      <div style="display: flex; justify-content: center; margin-bottom: 26px;">
        <image-slot id="add-manhwa-cover" shape="rounded" radius="8" placeholder="drop cover art" style="width: 160px; height: 240px;"></image-slot>
      </div>

      <form style="display: flex; flex-direction: column; gap: 18px;">
        <div>
          <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">TITLE</label>
          <input type="text" placeholder="Enter manhwa title" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.9rem;" style-focus="outline: none; border-color: #a29bfe; background: rgba(255,255,255,0.14);">
        </div>
        <div>
          <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">AUTHOR</label>
          <input type="text" placeholder="Enter author's name" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.9rem;" style-focus="outline: none; border-color: #a29bfe; background: rgba(255,255,255,0.14);">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div>
            <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">STATUS</label>
            <select style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #17111f; color: #fff; font-size: 0.9rem;">
              <option>Ongoing</option><option>Completed</option><option>Dropped</option><option>Hiatus</option>
            </select>
          </div>
          <div>
            <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">GENRE</label>
            <select style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #17111f; color: #fff; font-size: 0.9rem;">
              <option>BL</option><option>Straight</option><option>No Romance</option><option>Fantasy</option><option>Action</option><option>Comedy</option><option>Drama</option><option>Horror</option><option>Isekai</option><option>Slice of Life</option><option>Thriller</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">YOUR READING STATUS</label>
          <select value="{{ readingStatus }}" onChange="{{ onReadingStatusChange }}" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #17111f; color: #fff; font-size: 0.9rem;">
            <option value="Plan to Read">Plan to Read</option>
            <option value="Currently Reading">Currently Reading</option>
            <option value="Done">Done</option>
          </select>
        </div>

        <sc-if value="{{ showStartDate }}" hint-placeholder-val="{{ false }}">
          <div>
            <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">START READING DATE</label>
            <input type="date" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #17111f; color: #fff; font-size: 0.9rem;">
          </div>
        </sc-if>
        <sc-if value="{{ showFinishDate }}" hint-placeholder-val="{{ false }}">
          <div>
            <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">FINISH READING DATE</label>
            <input type="date" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #17111f; color: #fff; font-size: 0.9rem;">
          </div>
        </sc-if>

        <div>
          <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">READING LINK</label>
          <input type="url" placeholder="https://example.com/read/manhwa-title" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.9rem;" style-focus="outline: none; border-color: #a29bfe; background: rgba(255,255,255,0.14);">
        </div>

        <div>
          <label style="display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); margin-bottom: 6px;">DESCRIPTION</label>
          <textarea placeholder="Enter the manhwa's description here..." style="width: 100%; box-sizing: border-box; min-height: 120px; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.9rem; font-family: inherit; resize: vertical;" style-focus="outline: none; border-color: #a29bfe; background: rgba(255,255,255,0.14);"></textarea>
        </div>

        <div style="display: flex; gap: 14px; justify-content: center; margin-top: 8px;">
          <a href="library.html" style="text-align: center; text-decoration: none; font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.04em; color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.25); padding: 13px 28px; border-radius: 999px; font-weight: 600;" style-hover="border-color: rgba(255,255,255,0.5);">CANCEL</a>
          <a href="library.html" style="text-align: center; text-decoration: none; font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 0.04em; color: #17111f; background: linear-gradient(135deg, #a29bfe, #8a2be2); padding: 13px 28px; border-radius: 999px; font-weight: 600; box-shadow: 0 8px 24px rgba(138,43,226,0.4);" style-hover="box-shadow: 0 10px 30px rgba(138,43,226,0.55);">ADD MANHWA</a>
        </div>
      </form>
    </div>
  </main>

  <footer style="background: rgba(14,10,23,0.95); border-top: 1px solid rgba(255,255,255,0.08); padding: 20px 32px; text-align: center;">
    <p style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.05em; color: rgba(245,243,251,0.5); margin: 0;">&copy; 2026 &mdash; The Obscured Index. All rights reserved.</p>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { readingStatus: 'Plan to Read' };
  onReadingStatusChange = (e) => this.setState({ readingStatus: e.target.value });
  renderVals() {
    const s = this.state.readingStatus;
    return {
      readingStatus: s,
      onReadingStatusChange: this.onReadingStatusChange,
      showStartDate: s === 'Currently Reading' || s === 'Done',
      showFinishDate: s === 'Done',
    };
  }
}

</script>
</body>
</html>
