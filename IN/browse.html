<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../images/logo.png">
<script src="js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>body { margin: 0; }</style>
</helmet>

<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; background: #0e0a17;">

  <header style="position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; min-height: 72px; padding: 12px 24px; background: rgba(14, 10, 23, 0.85); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
      <img src="../images/logo3.png" alt="Logo" style="height: 40px; width: 40px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(162,155,254,0.35));">
      <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.05rem; color: #f5f3fb; letter-spacing: 0.02em;">The Obscured Index</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
      <a href="dashboard.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.75); text-decoration: none;">HOME</a>
      <a href="library.html" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.75); text-decoration: none;">LIBRARY</a>
      <a href="add-manhwa.html" style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.04em; color: #0e0a17; text-decoration: none; background: linear-gradient(135deg, #a29bfe, #8a2be2); padding: 9px 16px; border-radius: 999px; font-weight: 600;">+ ADD NEW</a>
      <a href="../logout.php" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: rgba(245,243,251,0.55); text-decoration: none;">LOGOUT</a>
    </nav>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px;">
    <a href="add-manhwa.html" style="display: inline-flex; align-items: center; gap: 6px; color: #c9bffc; text-decoration: none; font-size: 0.85rem; margin-bottom: 14px;">&larr; Back to Add Manhwa</a>
    <h1 style="font-family: 'Playfair Display', serif; font-weight: 500; color: #ffffff; font-size: 1.9rem; margin: 0 0 6px;">Browse Manhwa</h1>
    <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 0 0 28px;">Search across MangaDex and AniList, then click a result to add it.</p>

    <!-- Search bar -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input id="search-input" type="text" placeholder="Search by title..." value="{{ searchQuery }}"
        onInput="{{ onSearchInput }}" onKeyDown="{{ onSearchKeyDown }}"
        style="flex: 1; padding: 13px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.95rem; font-family: inherit;"
        style-focus="outline: none; border-color: #a29bfe; background: rgba(255,255,255,0.14);">
      <button onClick="{{ doSearch }}" style="font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.04em; color: #17111f; background: linear-gradient(135deg, #a29bfe, #8a2be2); padding: 13px 24px; border-radius: 999px; font-weight: 600; border: none; cursor: pointer;">SEARCH</button>
    </div>

    <!-- Source tabs -->
    <div style="display: flex; gap: 8px; margin-bottom: 28px;">
      <button onClick="{{ setSourceMangadex }}" style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.04em; padding: 8px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; background: {{ mangadexBg }}; color: {{ mangadexColor }};">MangaDex</button>
      <button onClick="{{ setSourceAnilist }}" style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.04em; padding: 8px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; background: {{ anilistBg }}; color: {{ anilistColor }};">AniList</button>
    </div>

    <!-- Status message -->
    <sc-if value="{{ statusMsg }}">
      <p style="color: rgba(255,255,255,0.45); font-size: 0.9rem; margin: 0 0 20px;">{{ statusMsg }}</p>
    </sc-if>

    <!-- Results grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px;">
      <sc-for list="{{ results }}" as="r">
        <div onClick="{{ r.onSelect }}" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.2s;" style-hover="border-color: #a29bfe;">
          <div style="height: 210px; overflow: hidden; background: #17111f;">
            <img src="{{ r.cover }}" alt="{{ r.title }}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
          </div>
          <div style="padding: 10px 12px 14px;">
            <p style="margin: 0 0 3px; font-size: 0.85rem; color: #f5f3fb; font-weight: 600; line-height: 1.3;">{{ r.title }}</p>
            <p style="margin: 0 0 4px; font-size: 0.72rem; color: rgba(255,255,255,0.5);">{{ r.author }}</p>
            <span style="font-size: 0.68rem; font-family: 'Cinzel', serif; letter-spacing: 0.04em; color: #c9bffc;">{{ r.status }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <footer style="background: rgba(14,10,23,0.95); border-top: 1px solid rgba(255,255,255,0.08); padding: 20px 32px; text-align: center;">
    <p style="font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.05em; color: rgba(245,243,251,0.5); margin: 0;">&copy; 2026 &mdash; The Obscured Index. All rights reserved.</p>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    searchQuery: '',
    source: 'mangadex',
    results: [],
    statusMsg: 'Search for a manhwa title above.',
  };

  onSearchInput = (e) => this.setState({ searchQuery: e.target.value });

  onSearchKeyDown = (e) => { if (e.key === 'Enter') this.doSearch(); };

  setSourceMangadex = () => {
    this.setState({ source: 'mangadex', results: [], statusMsg: 'Search for a manhwa title above.' });
  };

  setSourceAnilist = () => {
    this.setState({ source: 'anilist', results: [], statusMsg: 'Search for a manhwa title above.' });
  };

  doSearch = async () => {
    const q = this.state.searchQuery.trim();
    if (!q) return;
    this.setState({ statusMsg: 'Searching...', results: [] });
    try {
      const res = await fetch(`api/search_browse.php?q=${encodeURIComponent(q)}&source=${this.state.source}`);
      const data = await res.json();
      if (!data.length) {
        this.setState({ statusMsg: 'No results found. Try a different title or source.', results: [] });
      } else {
        this.setState({
          statusMsg: '',
          results: data.map(r => ({ ...r, onSelect: () => this.selectResult(r) })),
        });
      }
    } catch {
      this.setState({ statusMsg: 'Search failed. Check your connection.', results: [] });
    }
  };

  selectResult = (r) => {
    const params = new URLSearchParams({
      title:       r.title,
      author:      r.author,
      description: r.description,
      status:      r.status,
      cover:       r.cover,
    });
    window.location.href = 'add-manhwa.html?' + params.toString();
  };

  renderVals() {
    const { source, results, statusMsg, searchQuery } = this.state;
    const active = 'linear-gradient(135deg, #a29bfe, #8a2be2)';
    const inactive = 'rgba(255,255,255,0.05)';
    return {
      searchQuery,
      statusMsg,
      results,
      onSearchInput: this.onSearchInput,
      onSearchKeyDown: this.onSearchKeyDown,
      doSearch: this.doSearch,
      setSourceMangadex: this.setSourceMangadex,
      setSourceAnilist: this.setSourceAnilist,
      mangadexBg:    source === 'mangadex' ? active : inactive,
      mangadexColor: source === 'mangadex' ? '#17111f' : 'rgba(255,255,255,0.75)',
      anilistBg:     source === 'anilist'  ? active : inactive,
      anilistColor:  source === 'anilist'  ? '#17111f' : 'rgba(255,255,255,0.75)',
    };
  }
}
</script>
</body>
</html>
